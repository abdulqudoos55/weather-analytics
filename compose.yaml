services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: weather
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - weather_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather -d weather"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://weather:${POSTGRES_PASSWORD}@db:5432/weather
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  weather_data:
